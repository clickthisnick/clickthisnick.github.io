<!DOCTYPE html>
<html lang="en">
  <head>
    <title>{% if page.title %}{{ page.title }} – {% endif %}{{ site.name }} – {{ site.description }}</title>

    {% include meta.html %}

    <link rel="stylesheet" type="text/css" href="{{ site.baseurl }}/lib/css/bootswatch.css">
    <link rel="stylesheet" type="text/css" href="{{ site.baseurl }}/style.min.css" />
    <link rel="alternate" type="application/rss+xml" title="{{ site.name }} - {{ site.description }}" href="{{ site.baseurl }}/feed.xml" />
    <style>
      .skip-link {
        position: absolute;
        left: 0;
        top: 0;
        transform: translateY(-120%);
        background: #fff;
        color: #000;
        padding: 0.5em 1em;
        z-index: 1000;
      }
      .skip-link:focus {
        transform: none;
      }
      .visually-hidden {
        position: absolute !important;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }
      .site-name {
        line-height: 1.7;
      }
      .site-name a {
        color: #fff;
      }
      nav a[aria-current="page"] {
        text-decoration: underline;
      }
      a:focus-visible,
      button:focus-visible,
      input:focus-visible,
      select:focus-visible,
      textarea:focus-visible {
        outline: 2px solid #4183c4;
        outline-offset: 2px;
      }
      /* Headings in the main stylesheet are white and disappear on light panels. */
      .white-row h1,
      .white-row h2,
      .white-row h3,
      .white-row h4,
      .white-row h5,
      .white-row h6,
      .jumbotron h1,
      .jumbotron h2,
      .jumbotron h3,
      .jumbotron h4,
      .jumbotron h5,
      .jumbotron h6 {
        color: #000;
      }
    </style>
  </head>

  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    <div class="wrapper-masthead">
      <div class="container">
        <header class="masthead clearfix">
          <a href="{{ site.baseurl }}/" class="site-avatar" id="site-avatar">
            <img src="{{ site.avatar }}" alt="" width="64" height="64" />
            <span class="visually-hidden">{{ site.name }}, home</span>
          </a>

          <div class="site-info">
            <p class="site-name"><a href="{{ site.baseurl }}/" id="site-name">{{ site.name }}</a></p>
            <p class="site-description">{{ site.description }}</p>
          </div>

          <nav aria-label="Primary">
            <a id="nav-home" href="{{ site.baseurl }}/"{% if page.url == "/" %} aria-current="page"{% endif %}>Home</a>
            <a id="nav-blog" href="{{ site.baseurl }}/blog"{% if page.url == "/blog/" %} aria-current="page"{% endif %}>Blog</a>
            <a id="nav-projects" href="{{ site.baseurl }}/projects"{% if page.url == "/projects/" %} aria-current="page"{% endif %}>Projects</a>
            <a id="nav-contact" href="{{ site.baseurl }}/contact"{% if page.url == "/contact/" %} aria-current="page"{% endif %}>Contact</a>
          </nav>
        </header>
      </div>
    </div>

    <div id="main" role="main" class="container">
      {{ content }}
    </div>

    <div class="wrapper-footer">
      <div class="container">
        <footer class="footer">
          {% include svg-icons.html %}
        </footer>
      </div>
    </div>
  </body>
</html>
