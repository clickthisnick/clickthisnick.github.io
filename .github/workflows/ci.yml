name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Build site
        run: bundle exec jekyll build --trace

      - name: Test site
        run: bundle exec ruby test/site_test.rb

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: styles/package-lock.json

      - name: Compile styles
        working-directory: styles
        run: npm ci && npx sass style.scss /tmp/style.compiled.css --style=compressed --no-source-map
